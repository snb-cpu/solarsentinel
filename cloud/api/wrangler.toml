# The public API address (https://solarsentinel-api.pages.dev): a Pages project whose only job is to pass
# every request to the hub Durable Object. cloud/deploy.sh renames the two names below if you use another prefix.
name = "solarsentinel-api"
pages_build_output_dir = "./public"
compatibility_date = "2025-10-01"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"
script_name = "solarsentinel-hub"
