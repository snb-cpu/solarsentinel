# The hub: one Durable Object that holds all the live state. No public address of its own
# (workers.dev and preview URLs are off); the "api" Pages project reaches it through a binding.
name = "solarsentinel-hub"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
